apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>App2</title></head>
    <body style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; text-align: center; padding: 50px; font-family: Arial;">
        <h1 style="font-size: 4em;">Application 2</h1>
        <p style="font-size: 1.5em;">Host: app2.com</p>
        <p style="font-size: 1.2em; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; display: inline-block;">⚡ 3 Replicas ⚡</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: httpd
        image: httpd:2.4-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/local/apache2/htdocs
      volumes:
      - name: html
        configMap:
          name: app2-html