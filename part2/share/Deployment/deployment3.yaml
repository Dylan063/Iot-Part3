apiVersion: v1
kind: ConfigMap
metadata:
  name: app3-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>App3 - Default</title></head>
    <body style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; text-align: center; padding: 50px; font-family: Arial;">
        <h1 style="font-size: 4em;">Application 3</h1>
        <p style="font-size: 1.2em; background: rgba(255,255,255,0.3); padding: 5px 15px; border-radius: 20px; display: inline-block;">⭐ DEFAULT APPLICATION ⭐</p>
        <p style="font-size: 1.2em;">No specific host provided</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
      - name: httpd
        image: httpd:2.4-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/local/apache2/htdocs
      volumes:
      - name: html
        configMap:
          name: app3-html